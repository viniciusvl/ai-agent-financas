# Formato da SUA planilha de gastos (fonte única: prompts + escritor + leitura).
# Modelo simples de controle de gastos. Para mudar o modelo, altere a planilha E este arquivo;
# o agente confere o cabeçalho da aba contra este arquivo e não grava se houver divergência.
#
# campo: um de metodo_pagamento, data, hora, quant_parcelas, valor_compra, moeda, categoria,
#        descricao, texto_original, valor_parcela, valor_primeira_parcela, id, usuario,
#        registrado_em
# tipo:  texto | data | hora | datahora | moeda | inteiro | enum
#
# Datas são GRAVADAS em ISO (aaaa-mm-dd): com USER_ENTERED o Sheets interpreta "08/10/2026"
# conforme o locale da planilha (10 de agosto em en-US). ISO é inequívoco; a EXIBIÇÃO segue a
# formatação da coluna no Sheets (ex.: Formatar > Número > Data → dd/mm/aaaa).
aba: Gastos
colunas:
  - nome: Data
    campo: data
    tipo: data
    formato: "%Y-%m-%d"
  - nome: Descrição
    campo: descricao
    tipo: texto
  - nome: Categoria
    campo: categoria
    tipo: enum
  - nome: Forma de pagamento
    campo: metodo_pagamento
    tipo: enum
  - nome: Parcelas
    campo: quant_parcelas
    tipo: inteiro
  - nome: Valor
    campo: valor_compra
    tipo: moeda
  - nome: Valor da parcela
    campo: valor_parcela
    tipo: moeda
  - nome: Moeda
    campo: moeda
    tipo: enum
  # Preenchido pelo bot: evita gravar o mesmo gasto duas vezes.
  - nome: ID
    campo: id
    tipo: texto
