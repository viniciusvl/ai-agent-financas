# Conjunto de casos de avaliação do roteador e do extrator (spec T17).
#
# rota: escrita | leitura | outro
# esperado: apenas campos de CAMPOS_AVALIADOS e somente em casos de rota escrita.
#   Campos possíveis: valor_compra, moeda, metodo_pagamento, quant_parcelas, categoria.
#   Inclua apenas os campos que se quer conferir naquele caso.
