# Configuração do Nginx para o China Finanças Bot.
#
# Substitua `bot.SEU-DOMINIO.com` pelo domínio real antes de habilitar.
# O Nginx termina o TLS (Let's Encrypt/certbot) e faz proxy para o container
# em 127.0.0.1:8000. Apenas as rotas do webhook do Telegram e de health são
# expostas publicamente; qualquer outra rota retorna 404.

# Redireciona todo o HTTP para HTTPS, exceto o desafio do ACME (certbot).
server {
    listen 80;
    listen [::]:80;
    server_name bot.SEU-DOMINIO.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Servidor HTTPS: proxy para o app no container.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name bot.SEU-DOMINIO.com;

    ssl_certificate /etc/letsencrypt/live/bot.SEU-DOMINIO.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bot.SEU-DOMINIO.com/privkey.pem;

    # Diretivas TLS explícitas: os arquivos `options-ssl-nginx.conf` e
    # `ssl-dhparams.pem` só existem quando o plugin do `certbot --nginx` é usado;
    # aqui o certificado é emitido com `certbot certonly --webroot`.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Webhook do Telegram.
    location /telegram/webhook {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Healthcheck.
    location /health {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Qualquer outra rota não é exposta.
    location / {
        return 404;
    }
}
