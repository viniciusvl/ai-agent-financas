# Configuração TEMPORÁRIA para a 1ª fase do bootstrap do TLS (porta 80).
#
# Serve apenas o desafio do ACME em `/.well-known/acme-challenge/` para o
# `certbot certonly --webroot` emitir o certificado. Não há `listen 443 ssl`
# aqui justamente porque os certificados ainda não existem.
#
# Depois que o certificado for emitido, substitua este arquivo pela config
# completa (`china-financas-bot.conf`) e recarregue o Nginx.
#
# Substitua `bot.SEU-DOMINIO.com` pelo domínio real.

server {
    listen 80;
    listen [::]:80;
    server_name bot.SEU-DOMINIO.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 404;
    }
}
