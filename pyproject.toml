[project]
name = "china-financas-bot"
version = "0.1.0"
description = "Bot do Telegram para registrar gastos de viagem em uma planilha do Google Sheets"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["task(id): teste de aceite pertencente a uma task de spec (ex.: T01)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"app/messages.py" = ["E501"]
